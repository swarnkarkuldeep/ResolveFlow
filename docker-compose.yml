x-app-env: &app-env
  ENV: dev
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resolveflow}:${POSTGRES_PASSWORD:-resolveflow}@db:5432/${POSTGRES_DB:-resolveflow}
  APP_DATABASE_URL: postgresql+psycopg://rf_app:${APP_DB_PASSWORD:-rf_app_dev}@db:5432/${POSTGRES_DB:-resolveflow}
  SYSTEM_DATABASE_URL: postgresql+psycopg://rf_system:${SYSTEM_DB_PASSWORD:-rf_system_dev}@db:5432/${POSTGRES_DB:-resolveflow}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-rf_app_dev}
  SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:-rf_system_dev}
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  EMAIL_PROVIDER: smtp
  SEED_DEMO: "1"
  SIMULATE_INBOUND_ENABLED: "1"
  POSTMARK_WEBHOOK_SECRET: ${POSTMARK_WEBHOOK_SECRET:-dev-webhook-secret}
  PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-3000}

services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveflow}
      POSTGRES_DB: ${POSTGRES_DB:-resolveflow}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveflow} -d ${POSTGRES_DB:-resolveflow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025", "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"]

  api:
    restart: unless-stopped
    build: ./backend
    command: ["api"]
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    restart: unless-stopped
    build: ./backend
    command: ["worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}

  beat:
    restart: unless-stopped
    build: ./backend
    command: ["beat"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}

  web:
    restart: unless-stopped
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-3000}:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
