x-app-env: &app-env
  ENV: dev
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resolveflow}:${POSTGRES_PASSWORD:-resolveflow}@db:5432/${POSTGRES_DB:-resolveflow}
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolveflow}
      POSTGRES_DB: ${POSTGRES_DB:-resolveflow}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolveflow} -d ${POSTGRES_DB:-resolveflow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "1025:1025"]

  api:
    build: ./backend
    command: ["api"]
    environment: *app-env
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    build: ./backend
    command: ["worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}

  beat:
    build: ./backend
    command: ["beat"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
