server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve `api` via Docker DNS so a recreated api container is picked up without restarting web.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    # Overwrite (never append) so a client cannot spoof the address the rate limiters see.
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    # Same-origin app: no third-party scripts, styles or fonts are ever loaded.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
